<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orbitra — Admin</title>
<style>
  :root{--bg:#04060f;--ink:#f3f6ff;--muted:#9aa6c4;--line:rgba(150,175,230,.22);--accent:#5df0a8}
  *{box-sizing:border-box}
    [hidden]{display:none !important}
  body{margin:0;padding:32px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  h1{margin:0 0 20px;font-size:26px}
  .box{max-width:360px;display:grid;gap:12px}
  input,select,button{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  select option{background:#0c1226}
  button{cursor:pointer}
  .primary{background:var(--accent);color:#032018;font-weight:600;border:0}
  .danger{color:#ff8a8a}
  #msg{color:#ff8a8a;min-height:20px;font-size:14px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;white-space:nowrap}
  td.msg{max-width:320px;white-space:pre-wrap;color:var(--muted)}
</style>
</head>
<body>
<h1>Orbitra leads</h1>

<div id="login" class="box">
  <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
  <button id="loginBtn" class="primary">Log in</button>
  <div id="msg"></div>
</div>

<div id="app" hidden>
  <div class="bar"><span id="count"></span><button id="logout">Log out</button></div>
  <div class="wrap">
    <table>
      <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Company</th><th>Team</th><th>Message</th><th>Stage</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const STAGES = ['NEW', 'QUALIFIED', 'NEGOTIATION', 'WON', 'LOST'];
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem('orbitra_token');

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }
  });
  if (res.status === 401) { logout(); throw new Error('Session expired. Please log in again.'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

function logout() {
  sessionStorage.removeItem('orbitra_token');
  token = null;
  $('app').hidden = true;
  $('login').hidden = false;
}

function cell(text, className) {
  const td = document.createElement('td');
  td.textContent = text;
  if (className) td.className = className;
  return td;
}

async function loadLeads() {
  const leads = await api('/api/leads');
  $('count').textContent = leads.length + ' lead' + (leads.length === 1 ? '' : 's');
  const rows = $('rows');
  rows.replaceChildren();
  for (const lead of leads) {
    const tr = document.createElement('tr');
    tr.append(
      cell(new Date(lead.createdAt).toLocaleString()),
      cell(lead.name), cell(lead.email), cell(lead.company),
      cell(lead.teamSize), cell(lead.message, 'msg')
    );

    const stageTd = document.createElement('td');
    const select = document.createElement('select');
    for (const s of STAGES) {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      if (s === lead.stage) opt.selected = true;
      select.append(opt);
    }
    select.addEventListener('change', async () => {
      try { await api('/api/leads/' + lead.id, { method: 'PATCH', body: JSON.stringify({ stage: select.value }) }); }
      catch (err) { alert(err.message); }
    });
    stageTd.append(select);

    const delTd = document.createElement('td');
    const del = document.createElement('button');
    del.textContent = 'Delete'; del.className = 'danger';
    del.addEventListener('click', async () => {
      if (!confirm('Delete this lead?')) return;
      try { await api('/api/leads/' + lead.id, { method: 'DELETE' }); loadLeads(); }
      catch (err) { alert(err.message); }
    });
    delTd.append(del);

    tr.append(stageTd, delTd);
    rows.append(tr);
  }
}

async function showApp() {
  try {
    await loadLeads();
    $('login').hidden = true;
    $('app').hidden = false;
  } catch (err) { $('msg').textContent = err.message; }
}

$('loginBtn').addEventListener('click', async () => {
  $('msg').textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed.');
    token = data.token;
    sessionStorage.setItem('orbitra_token', token);
    $('pw').value = '';
    showApp();
  } catch (err) { $('msg').textContent = err.message; }
});
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logout').addEventListener('click', logout);

if (token) showApp();
</script>
</body>
</html>
