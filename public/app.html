<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbitra — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060f;--ink:#f3f6ff;--muted:#9aa6c4;--line:rgba(150,175,230,.12);--line-strong:rgba(150,175,230,.22);--accent:#5df0a8;--accent-2:#2fd38a;--glass:rgba(12,18,38,.55);--font:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(90% 50% at 50% 0%,#0a1330,var(--bg));min-height:100vh}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;padding:22px 24px}
.brand{font-weight:800;font-size:19px;letter-spacing:.16em}
.brand span{color:var(--accent);font-size:14px;margin-right:8px}
.out{font-size:14px;color:var(--muted);cursor:pointer;background:none;border:1px solid var(--line-strong);border-radius:999px;padding:8px 16px;font-family:inherit}
main{max-width:1100px;margin:0 auto;padding:10px 24px 60px}
h1{font-size:32px;font-weight:800}
.sub{color:var(--muted);margin:8px 0 28px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{padding:24px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.card b{display:block;font-size:30px;font-weight:800;margin-top:6px}
.card small{color:var(--muted);font-size:13.5px}
.chart{margin-top:16px;padding:24px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:12px;height:180px;margin-top:16px}
.bars div{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--accent),rgba(47,211,138,.25))}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <div class="top">
    <a href="index.html" class="brand"><span>▲</span>Orbitra</a>
    <button class="out" id="logout">Log out</button>
  </div>
  <main>
    <h1 id="hello">Welcome</h1>
    <p class="sub" id="planInfo"></p>
    <div class="grid">
      <div class="card"><small>Pipeline</small><b>$1.2M</b></div>
      <div class="card"><small>Forecast accuracy</small><b>92%</b></div>
      <div class="card"><small>Win rate</small><b>31%</b></div>
      <div class="card"><small>At-risk deals</small><b>7</b></div>
    </div>
    <div class="chart">
      <small style="color:var(--muted)">Pipeline by week</small>
      <div class="bars">
        <div style="height:55%"></div><div style="height:72%"></div><div style="height:48%"></div>
        <div style="height:90%"></div><div style="height:66%"></div><div style="height:80%"></div><div style="height:95%"></div>
      </div>
    </div>
  </main>

<script>
const user = JSON.parse(localStorage.getItem('orbitraUser') || 'null');
if(!user){ location.href = 'signup.html'; }   // not signed up yet, send to sign-up
else{
  document.getElementById('hello').textContent = 'Welcome, ' + user.name.split(' ')[0];
  document.getElementById('planInfo').textContent =
    (user.plan === 'growth' ? 'Growth trial' : 'Starter plan') + (user.company ? ' · ' + user.company : '');
}
document.getElementById('logout').onclick = () => { localStorage.removeItem('orbitraUser'); location.href = 'index.html'; };
</script>
</body>
</html>
