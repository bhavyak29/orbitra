<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbitra — Get Started</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060f;--ink:#f3f6ff;--muted:#9aa6c4;--line-strong:rgba(150,175,230,.22);--accent:#5df0a8;--accent-2:#2fd38a;--accent-ink:#032018;--glass-2:rgba(16,24,48,.65);--font:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(90% 60% at 50% 0%,#0a1330,var(--bg));min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
a{color:inherit;text-decoration:none}
.box{width:100%;max-width:440px;padding:40px 34px;border-radius:26px;background:var(--glass-2);border:1px solid var(--line-strong);box-shadow:0 30px 80px -30px rgba(0,0,0,.75)}
.brand{font-weight:800;font-size:19px;letter-spacing:.16em;display:block;text-align:center;margin-bottom:22px}
.brand span{color:var(--accent);font-size:14px;margin-right:8px}
h1{font-size:28px;font-weight:800;text-align:center}
.plan{display:block;text-align:center;margin:10px 0 26px;color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
label{display:block;font-size:13.5px;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(0,0,0,.3);color:var(--ink);font:inherit;font-size:15px;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:24px;padding:15px;border:0;border-radius:999px;cursor:pointer;font:inherit;font-size:16px;font-weight:600;color:var(--accent-ink);background:linear-gradient(180deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px -8px rgba(93,240,168,.55)}
.note{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}



</style>
</head>
<body>
  <div class="box">
    <a href="index.html" class="brand"><span>▲</span>Orbitra</a>
    <h1>Create your account</h1>
    <span class="plan" id="planLabel">Starter plan</span>

    <form id="signupForm">
      <label for="name">Full name</label>
      <input id="name" type="text" required placeholder="Jane Doe">
      <label for="email">Work email</label>
      <input id="email" type="email" required placeholder="jane@company.com">
      <label for="company">Company</label>
      <input id="company" type="text" placeholder="Acme Inc.">
      <button type="submit">Start now</button>
    </form>

    <p class="note">Demo sign-up. No real account is created.</p>
  </div>

<script>
const plans = { starter:'Starter plan', growth:'Growth plan · 14-day free trial' };
const plan = new URLSearchParams(location.search).get('plan') || 'starter';
document.getElementById('planLabel').textContent = plans[plan] || plans.starter;

document.getElementById('signupForm').addEventListener('submit', e => {
  e.preventDefault();
  const user = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    company: document.getElementById('company').value.trim(),
    plan
  };
  localStorage.setItem('orbitraUser', JSON.stringify(user));
  location.href = 'app.html';
});
</script>
</body>
</html>
